<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealT4</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d12;
      color: #ffffff;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .content {
      max-width: 900px;
    }

    .label {
      color: #39f5c5;
      letter-spacing: 2px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 56px;
      line-height: 1.1;
      margin: 0 0 24px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      color: #b7c7d8;
      margin-bottom: 32px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: #39f5c5;
      color: #061018;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="content">
      <div class="label">REALT4</div>
      <h1>Software Technology R&D for Data-Driven Spatial Operations</h1>
      <p>
        Transform physical spaces into digital operation environments through
        3D spatial visualization, IoT data integration, and interactive software platforms.
      </p>
      <a class="button" href="#">Explore Solutions</a>
    </div>
  </section>
</body>
</html>
